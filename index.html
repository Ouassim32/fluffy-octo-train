<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Video</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    /* Video player covering full screen, visible immediately */
    #prankVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- 
    autoplay: starts playing immediately
    muted: required by browsers to allow autoplay
    loop: tells the browser to repeat the video infinitely
    playsinline: keeps video inline on mobile iOS
  -->
  <video id="prankVideo" autoplay muted loop playsinline preload="auto">
    <source src="https://github.com/Ouassim32/fluffy-octo-train/raw/refs/heads/main/nyan-cat.mp4" type="video/mp4">
  </video>

  <script>
    const video = document.getElementById('prankVideo');

    // Unmutes audio as soon as the user taps anywhere on the screen
    document.addEventListener('click', function() {
      video.muted = false;
    });

    // Backup to enforce infinite loop on older mobile browsers
    video.addEventListener('ended', function() {
      video.currentTime = 0;
      video.play();
    });
  </script>
</body>
</html>
